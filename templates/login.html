<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <style>
        /* Немного базовых стилей, чтобы глаза не болели */
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        form { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 1rem; width: 300px; }
        input { padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 0.5rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .error { color: red; font-size: 0.9rem; text-align: center; margin: 0; }
    </style>
</head>
<body>

    <form action="/login" method="post">
        <h2 style="text-align: center; margin-top: 0;">Авторизация</h2>
        
        <!-- Показываем ошибку, если она есть -->
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <input class="login" type="text" name="login" placeholder="Логин" required>
        <input class="password" type="password" name="password" placeholder="Пароль" required>
        
        <button type="submit">Войти</button>
    </form>

</body>
</html>
